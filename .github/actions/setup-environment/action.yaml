name: 'Setup Python Environment'
description: 'Sets up Python, installs Poetry, and caches/installs dependencies.'

runs:
  using: "composite"
  env:
    POETRY_HOME: ${{ github.workspace }}/.poetry
    PATH: ${{ github.workspace }}/.poetry/bin:${{ env.PATH }}

  steps:
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'poetry'

    - name: Install Poetry and dependencies
      shell: bash
      run: |
        set -eux
        curl -sSL https://install.python-poetry.org | python3 - --install-dir $POETRY_HOME --version 1.8.3
        poetry --version
        poetry install --no-interaction --no-ansi
