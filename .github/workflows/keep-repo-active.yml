name: Keep Repository Active

# GitHub auto-disables scheduled workflows after 60 days without repository
# activity. This workflow makes one trivial timestamped commit per month so the
# repo (and therefore the "Keep Streamlit Apps Awake" schedule) stays active.
#
# NOTE: scheduled workflows only fire from the DEFAULT branch (main), so this
# must be merged to main to take effect automatically.

on:
  schedule:
    - cron: "23 17 1 * *"   # ~every 30 days: 1st of month, 17:23 UTC
  workflow_dispatch: {}      # enables manual "Run workflow" for testing

permissions:
  contents: write

concurrency:
  group: keep-repo-active
  cancel-in-progress: true

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Trivial timestamped change
        run: |
          echo "keep-alive $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> .github/keep-alive.log

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # main is branch-protected (changes must come through PRs), so the heartbeat
          # lives on the unprotected 'dev' branch instead. dev is behind main and holds
          # no unique commits, so recreating it at main and force-pushing is safe; it
          # stays exactly one commit ahead of main.
          git switch -C dev
          # -f is required: .gitignore ignores *.log, and git add refuses ignored files
          git add -f .github/keep-alive.log
          git commit -m "chore: keep-alive heartbeat $(date -u +'%Y-%m-%d')" || echo "nothing to commit"
          git push -f origin dev
