name: Keep Streamlit Apps Awake

# WHY THIS USES A BROWSER (verified 2026-09-29) - please do not "simplify" it back to curl:
#
#  1. HTTP responses cannot tell awake from asleep: / and /_stcore/health both return the
#     same ~9.8 KB static SPA shell ("You need to enable JavaScript to run this app") in
#     every state - measured identical for a hibernating app and a running one, and
#     /_stcore/health never returns "ok". Only the rendered DOM differs.
#
#  2. Without a cookie jar, curl loops forever on the Community Cloud auth handshake
#     (/ -> 303 -> share.streamlit.io/-/auth/app -> 303 -> /-/login?payload=... -> 303 -> /)
#     and fails with `curl: (47) Maximum (50) redirects followed`, reporting HTTP 303.
#
#  3. Streamlit hibernates apps after 12h with no traffic, and only a real browser
#     session - JavaScript + a websocket to /_stcore/stream - counts as a "visit".
#     Server-side HTTP pings NEVER reset the hibernation timer (repo "keep-alive"
#     commits don't either; that heartbeat only stops GitHub disabling our schedules).
#
#  => The old curl probe reported "awake and responding" for apps that were actually
#     sleeping (prior run logs show curl exit 47 + HTTP 303 -> ##[notice] awake).
#     This workflow drives headless Chromium via Playwright instead: it loads each app,
#     clicks "Yes, get this app back up!" when the sleep page is showing, waits for the
#     running shell, and holds the session open so the visit registers.
#
#  Running-vs-asleep detection (2026-09 build): the sleep page shows
#  [data-testid^="wakeup-button"]; a running app has no such button, renders
#  #root > div > div[class*="streamlitAppContainer"] wrapping an iframe, and holds an
#  open /_stcore/stream websocket. The older `[data-testid='stAppViewContainer']` /
#  `.stApp` / `section.main` markers NO LONGER EXIST in that build, so checking only for
#  them reports false failures for perfectly healthy apps.
#
#  NOTE: scheduled workflows only fire from the DEFAULT branch (main), so this must be
#  merged to main to run automatically. `workflow_dispatch` also supports running it
#  against a feature branch via: gh workflow run keep-apps-awake.yml --ref <branch>
#  (temi-phillips is https://, normalized from http:// - Streamlit serves HTTPS
#  and redirects).

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3h UTC; :17 avoids GitHub's top-of-hour cron peak
  workflow_dispatch:
    inputs:
      hold_seconds:
        description: "Seconds to hold each session open (default 60)"
        default: "60"
      urls:
        description: "Space-separated URLs to visit (blank = the default three)"
        default: ""

permissions:
  contents: read

concurrency:
  group: keep-apps-awake
  cancel-in-progress: true

jobs:
  visit:
    name: Browser visit (wake + keep awake)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URLS: |
        https://phillips-fitness-assistant.streamlit.app/
        https://samphillipsprofile.streamlit.app/
        https://temi-phillips.streamlit.app/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.55.0
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.55.0
          python -m playwright install chromium --with-deps

      - name: Visit apps (wake them if asleep)
        env:
          HOLD_SECONDS: ${{ github.event.inputs.hold_seconds || '60' }}
          URLS_INPUT: ${{ github.event.inputs.urls }}
        run: |
          if [ -n "${URLS_INPUT}" ]; then
            readarray -t target_urls < <(printf '%s' "${URLS_INPUT}" | tr ' ' '\n' | grep -v '^[[:space:]]*$')
          else
            # APP_URLS is a YAML block scalar that ends in a trailing newline, so a plain
            # `readarray ... <<< "${APP_URLS}"` appends an empty element to the array and
            # hands Python a bogus "" URL - see the 2026-09-29 run that failed on
            # "Page.goto: Cannot navigate to invalid URL" after all three apps were already
            # reported RUNNING. Drop blank lines before visiting anything.
            readarray -t target_urls < <(printf '%s' "${APP_URLS}" | grep -v '^[[:space:]]*$')
          fi
          if [ "${#target_urls[@]}" -eq 0 ]; then
            echo "::error::No URLs provided to visit"
            exit 1
          fi
          echo "Visiting: ${target_urls[*]}"
          # -u keeps the per-app WOKE/RUNNING/FAILED lines streaming into the log instead
          # of being flushed only when the process exits.
          python -u .github/scripts/keep_streamlit_awake.py \
            "${target_urls[@]}" \
            --hold-seconds "${HOLD_SECONDS}" \
            --timeout-ms 180000
