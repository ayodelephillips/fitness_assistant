name: tdd-enforcer
description: "Ensures cline uses TDD (Test-Driven Development) approach when writing code — tests are written before implementation"
version: "1.0.0"
inputs:
  - name: source_file
    type: string
    required: true
    description: "Path to the source file being implemented (e.g., fitness_assistant/rag/helper.py)"
  - name: feature_description
    type: string
    required: true
    description: "Description of the feature being implemented"
steps:
  - tool: check_test_exists
    args:
      source_file: "{{ inputs.source_file }}"
  - tool: read_test_file
    args:
      test_path: "{{ test_file_path }}"
outputs:
  - name: tdd_status
    description: "TDD compliance status: PASS, WARN, or FAIL"
    from: "result.data.tdd_status"
  - name: test_file_path
    description: "Path to the corresponding test file"
    from: "result.data.test_file_path"
  - name: guidance
    description: "TDD guidance for the developer"
    from: "result.data.guidance"
tdd_rules:
  - id: test_before_implementation
    name: "Write tests first"
    description: "Before writing implementation code, write failing tests that define expected behavior"
  - id: test_matches_source
    name: "Test file naming"
    description: "Test file should mirror source file path under tests/ directory (e.g., fitness_assistant/rag/helper.py → tests/unit_tests/test_helper.py)"
  - id: red_green_refactor
    name: "Red-Green-Refactor cycle"
    description: "1. Write failing test (red). 2. Write minimal code to pass (green). 3. Refactor while keeping tests passing."
validation_checklist:
  - "Does a test file exist for this source file?"
  - "Do the tests define the expected behavior before implementation?"
  - "Are tests written for edge cases and error conditions?"
  - "Does implementation only include code needed to pass tests?"
