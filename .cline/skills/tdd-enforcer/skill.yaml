name: tdd-enforcer
description: "Ensures cline uses TDD (Test-Driven Development) approach when writing code — tests are written before implementation"
version: "1.0.0"
inputs:
  - name: source_file
    type: string
    required: true
    description: "Path to the source file being implemented (e.g., fitness_assistant/rag/helper.py)"
  - name: feature_description
    type: string
    required: true
    description: "Description of the feature being implemented"
steps:
  - tool: git_diff_files
    args:
      base: "main"
      feature: "HEAD"
outputs:
  - name: tdd_guidance
    description: "TDD guidance and validation checklist for the feature"
    from: "result.data.tdd_guidance"
templates:
  tdd_guidance: |
    # TDD Enforcement Guidance

    Source file: {{ inputs.source_file }}
    Feature: {{ inputs.feature_description }}

    ## TDD Rules

    ### 1. Write Tests First
    Before writing implementation code, write failing tests that define expected behavior.

    ### 2. Test File Naming
    Test file should mirror source file path under `tests/` directory.
    Example: `fitness_assistant/rag/helper.py` → `tests/unit_tests/test_helper.py`

    ### 3. Red-Green-Refactor Cycle
    1. **Red**: Write a failing test
    2. **Green**: Write minimal code to pass the test
    3. **Refactor**: Improve code while keeping tests passing

    ## Validation Checklist

    - [ ] Does a test file exist for this source file?
    - [ ] Do the tests define the expected behavior before implementation?
    - [ ] Are tests written for edge cases and error conditions?
    - [ ] Does implementation only include code needed to pass tests?
    - [ ] All tests pass (`poetry run pytest`)
    - [ ] Pre-commit hooks pass (`pre-commit run --all-files`)

    ## Changed Files

    {{#each changed_files}}
    - `{{ this.path }}` ({{ this.status }})
    {{/each}}

    ---

    *Generated by [cline skill: tdd-enforcer]*
