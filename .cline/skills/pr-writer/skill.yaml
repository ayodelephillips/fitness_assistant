name: pr-writer
description: "Generate a conventional, easy-to-understand PR description that documents TDD approach and best practices"
version: "1.0.0"
inputs:
  - name: base_branch
    type: string
    required: false
    default: "main"
    description: "The branch being merged into (default: main)"
  - name: feature_branch
    type: string
    required: false
    default: "HEAD"
    description: "The branch being merged from (default: current HEAD)"
steps:
  - tool: git_diff_stat
    args:
      base: "{{ inputs.base_branch }}"
      feature: "{{ inputs.feature_branch }}"
  - tool: git_diff_files
    args:
      base: "{{ inputs.base_branch }}"
      feature: "{{ inputs.feature_branch }}"
outputs:
  - name: pr_body
    description: "Complete PR description in conventional English"
    from: "result.data.pr_body"
templates:
  pr_body: |
    ## Summary

    {{#if feature_description}}
    {{ feature_description }}
    {{/if}}

    ### Changes

    {{#each changed_files}}
    - `{{ this.path }}` ({{ this.status }}): {{ this.description }}
    {{/each}}

    ## TDD Approach

    Tests were written before implementation to ensure:
    - Every new feature has corresponding test coverage
    - Edge cases are captured in unit tests
    - Refactoring can be done with confidence

    ### Test Files

    {{#each test_files}}
    - `{{ this }}`
    {{/each}}

    ## Best Practices Applied

    - **Type hints**: All public functions include type annotations
    - **Docstrings**: All modules, classes, and public methods documented
    - **Error handling**: Specific exception types caught, no bare `except`
    - **Safety settings**: LLM safety thresholds configured (see `settings.py`)
    - **No secrets committed**: API keys and tokens excluded from version control
    - **Input validation**: User inputs validated before processing

    ## Pre-Merge Checklist

    - [ ] All unit tests pass (`poetry run pytest`)
    - [ ] Pre-commit hooks pass (`pre-commit run --all-files`)
    - [ ] Streamlit app boots successfully (smoke test)
    - [ ] No sensitive data (API keys, tokens) in committed files
    - [ ] Tests written for all new functionality (TDD)
    - [ ] Documentation updated if user-facing behavior changed

    ## Testing

    Run the test suite before merging:

    ```bash
    poetry run pytest
    ```

    Run pre-commit checks:

    ```bash
    pre-commit run --all-files
    ```

    ---

    *Generated by [cline skill: pr-writer]*
