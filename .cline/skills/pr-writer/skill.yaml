name: pr-writer
description: "Generate a conventional, easy-to-understand PR description in plain English"
version: "1.0.0"
inputs:
  - name: base_branch
    type: string
    required: false
    default: "main"
    description: "The branch being merged into (default: main)"
  - name: feature_branch
    type: string
    required: false
    default: "HEAD"
    description: "The branch being merged from (default: current HEAD)"
steps:
  - tool: git_diff_stat
    args:
      base: "{{ inputs.base_branch }}"
      feature: "{{ inputs.feature_branch }}"
  - tool: git_diff_files
    args:
      base: "{{ inputs.base_branch }}"
      feature: "{{ inputs.feature_branch }}"
outputs:
  - name: pr_body
    description: "Complete PR description in conventional English"
    from: "result.data.pr_body"
templates:
  pr_body: |
    ## Summary

    {{#if feature_description}}
    {{ feature_description }}
    {{/if}}

    ### Changes

    {{#each changed_files}}
    - `{{ this.path }}` ({{ this.status }}): {{ this.description }}
    {{/each}}

    ---

    *Generated by [cline skill: pr-writer]*
