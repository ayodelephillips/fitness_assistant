name: pr-review
description: "Generate and post a PR review comment to Jira"
version: "1.0.0"
inputs:
  - name: pr_number
    type: integer
    required: true
    description: "GitHub Pull Request number"
  - name: pr_title
    type: string
    required: true
    description: "PR title"
  - name: pr_url
    type: string
    required: true
    description: "PR URL"
  - name: jira_issue_key
    type: string
    required: true
    description: "Jira issue key to link the PR to (e.g., PROJ-123)"
  - name: review_summary
    type: string
    required: true
    description: "Summary of the code review findings"
steps:
  - tool: JIRA_ADD_COMMENT
    args:
      issue_key: "{{ inputs.jira_issue_key }}"
      body: |
        🔗 PR Review: {{ inputs.pr_title }}
        📋 PR #{{ inputs.pr_number }}: {{ inputs.pr_url }}
        
        ---
        
        {{ inputs.review_summary }}
outputs:
  - name: comment_id
    description: "The ID of the created comment"
    from: "result.data.id"
