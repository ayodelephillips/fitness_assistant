name: pr-reviewer
description: "Review code on the current branch for TDD compliance, best practices, and LLM safety — outputs a review template for manual/CI execution"
version: "1.0.0"
inputs:
  - name: branch
    type: string
    required: false
    default: "HEAD"
    description: "The branch to review (default: current HEAD)"
  - name: base_branch
    type: string
    required: false
    default: "main"
    description: "The base branch to compare against (default: main)"
steps:
  - tool: git_diff_files
    args:
      base: "{{ inputs.base_branch }}"
      feature: "{{ inputs.branch }}"
outputs:
  - name: review_template
    description: "Code review template with checklist items"
    from: "result.data.review_template"
templates:
  review_template: |
    ## PR Review: {{ inputs.branch }} → {{ inputs.base_branch }}

    ### TDD Compliance

    - [ ] Each source file under `fitness_assistant/` has a corresponding test file under `tests/`
    - [ ] Tests were written before implementation
    - [ ] Edge cases and error conditions are covered

    ### Code Quality

    - [ ] Type hints on all public functions and methods
    - [ ] Docstrings on all modules, classes, and public methods
    - [ ] No bare `except:` clauses — specific exception types only
    - [ ] No `print()` statements in library code (use logging instead)

    ### LLM Safety

    - [ ] `settings.py` defines `safety_settings` with appropriate `HarmBlockThreshold` values
    - [ ] System prompt constrains output to CONTEXT only
    - [ ] Human prompt uses `{question}` and `{context}` placeholders

    ### Security

    - [ ] No API keys, tokens, or passwords committed
    - [ ] No secrets in environment variables checked into version control

    ### Verdict

    - [ ] APPROVE — All checks pass
    - [ ] REQUEST_CHANGES — Critical issues found
    - [ ] COMMENT — Minor suggestions only

    ### Notes

    {{#each changed_files}}
    - `{{ this.path }}` ({{ this.status }})
    {{/each}}

    ---

    *Generated by [cline skill: pr-reviewer]*
